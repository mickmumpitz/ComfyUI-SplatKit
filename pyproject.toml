[project]
name = "comfyui-splatkit"
version = "1.0.0"
description = "Build 3D Gaussian Splat training datasets from a single 360 panorama, inside ComfyUI. Pano -> MoGe depth -> WAN camera-motion video -> COLMAP dataset for LichtFeld / gsplat / 3DGRUT."
license = "MIT"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/mickmumpitz/ComfyUI-SplatKit"

[tool.comfy]
PublisherId = "mickmumpitz"
DisplayName = "ComfyUI-SplatKit"
